[project]
name = "background-remover"
version = "0.1.0"
description = "OpenVINO background removal and product image tools"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.3.0",
    "pillow>=12.3.0",
    "huggingface-hub>=1.27.0",
    "einops>=0.8.2",
    "kornia>=0.8.3",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
    "flask>=3.1.3",
]
